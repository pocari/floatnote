<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatNote 設定</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <h1>設定</h1>

    <section>
      <h2>ホットキー</h2>
      <p class="desc">押すとノートを最前面に戻して表示します。未設定の場合は無効です。</p>
      <div class="row">
        <div id="hotkey-display" class="hotkey-display" tabindex="0">未設定</div>
        <button id="record-btn">キーを設定</button>
        <button id="clear-btn" class="secondary">解除</button>
      </div>
      <p id="hint" class="hint">「キーを設定」を押してから、登録したいキーの組み合わせを押してください。⌘ / ⌃ / ⌥ のいずれかが必要です。Esc でキャンセル。</p>
      <p id="error" class="error" hidden></p>
    </section>

    <section>
      <h2>ウィンドウ位置</h2>
      <div class="row radios">
        <label><input type="radio" name="level" value="top" /> 常に最前面</label>
        <label><input type="radio" name="level" value="normal" /> 通常</label>
        <label><input type="radio" name="level" value="bottom" /> 常に最奥</label>
      </div>
    </section>

    <section>
      <h2>起動</h2>
      <label class="check"><input type="checkbox" id="autostart" /> ログイン時に FloatNote を起動</label>
      <p id="autostart-note" class="hint" hidden>開発実行中（tauri dev）は反映されません。ビルドした .app で有効になります。</p>
    </section>

    <section>
      <h2>データ</h2>
      <p class="desc">ノートは <code id="note-path">…</code> に自動保存されます。</p>
    </section>

    <p class="version">FloatNote <span id="app-version">…</span></p>
  </body>
</html>
