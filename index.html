<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatNote</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="bar" data-tauri-drag-region>
      <span class="spacer" data-tauri-drag-region></span>
      <button id="settings-btn" class="icon-btn" title="設定">⚙</button>
    </header>
    <div id="level" role="radiogroup" aria-label="ウィンドウ位置">
      <button data-level="top" role="radio">⬆ 最前面</button>
      <button data-level="normal" role="radio">↕ 通常</button>
      <button data-level="bottom" role="radio">⬇ 最奥</button>
    </div>
    <section id="focus" hidden>
      <ul id="focus-list"></ul>
    </section>
    <div id="editor-wrap">
      <div id="highlight" aria-hidden="true"></div>
      <textarea id="editor" placeholder="メモを書く…" spellcheck="false"></textarea>
    </div>
    <div id="toast" hidden></div>
  </body>
</html>
