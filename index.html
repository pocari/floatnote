<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatNote</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="bar" data-tauri-drag-region>
      <span class="spacer" data-tauri-drag-region></span>
      <div class="menu-wrap">
        <button id="level-btn" class="icon-btn" title="ウィンドウ位置"></button>
        <div id="level-menu" class="menu" hidden>
          <button data-level="top">⬆ 常に最前面</button>
          <button data-level="normal">↕ 通常</button>
          <button data-level="bottom">⬇ 常に最奥 <small>他のウィンドウの後ろに回ります</small></button>
        </div>
      </div>
      <button id="settings-btn" class="icon-btn" title="設定">⚙</button>
    </header>
    <div id="editor-wrap">
      <div id="highlight" aria-hidden="true"></div>
      <textarea id="editor" placeholder="メモを書く…" spellcheck="false"></textarea>
    </div>
    <div id="toast" hidden></div>
  </body>
</html>
